# Chipathon 2026 project configuration for Team A44.
# The main branch is the submission source.

project:
  title: "A44 8-bit 2-MS/s SAR ADC"
  team: "A44 JST"
  discord: ""
  description: "3.3-V fully differential capacitive SAR ADC in GF180MCU"
  lvs_config: "lvs_config.json"

pins:
  - name: "GND"
    io_type: ground

  - name: "VDD"
    io_type: power

  - name: "CLKS"
    io_type: input_cmos

  - name: "DOUT[7]"
    io_type: bidirectional
  - name: "DOUT[6]"
    io_type: bidirectional
  - name: "DOUT[5]"
    io_type: bidirectional
  - name: "DOUT[4]"
    io_type: bidirectional
  - name: "DOUT[3]"
    io_type: bidirectional
  - name: "DOUT[2]"
    io_type: bidirectional
  - name: "DOUT[1]"
    io_type: bidirectional
  - name: "DOUT[0]"
    io_type: bidirectional

  - name: "VREFN"
    io_type: analog
    secondary_esd: true
  - name: "VINN"
    io_type: analog
    secondary_esd: true
  - name: "VINP"
    io_type: analog
    secondary_esd: true
  - name: "VREFP"
    io_type: analog
    secondary_esd: true
